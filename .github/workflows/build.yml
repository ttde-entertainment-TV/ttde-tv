name: Compilar APK
on:
  workflow_dispatch:
  push:
    paths: ["lib/**", "pubspec.yaml", ".github/workflows/build.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - name: Generar proyecto Android
        run: |
          flutter create /tmp/scaf --platforms=android --project-name ttde_tv --org com.ttde
          cp -r /tmp/scaf/android ./android
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="TTDE TV"#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: TTDE TV v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
